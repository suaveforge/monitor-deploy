name: Fix SiteHub project editor once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sitehub-project-editor-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch live project editor without touching Actions UI
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const htmlPath='index.html', appPath='app.js';
          let html=fs.readFileSync(htmlPath,'utf8');
          let app=fs.readFileSync(appPath,'utf8');
          if(!html.includes('name="hub_site_enabled"')){
            const matches=[...html.matchAll(/^[ \t]*<div class="project-hub-row" data-hub-row="localize">.*<\/div>$/gm)];
            if(matches.length!==1)throw new Error(`localize row count ${matches.length}`);
            const row=matches[0][0];
            const indent=row.match(/^\s*/)?.[0]||'';
            const site=`${indent}<div class="project-hub-row" data-hub-row="site"><label class="hub-toggle"><input type="checkbox" name="hub_site_enabled"> Site Hub</label><input name="hub_site_probe" type="url" placeholder="선택사항 · 프로젝트별 연결 확인 URL"><span class="hub-project-status" data-hub-project-status="site">미등록</span></div>`;
            html=html.replace(row,row+'\n'+site);
          }
          const list="['auth','pay','localize']";
          const list2="['auth','pay','localize','site']";
          const count=app.split(list).length-1;
          if(count!==2 && !app.includes(list2))throw new Error(`hub form list count ${count}`);
          app=app.split(list).join(list2);
          const defs="const defs={auth:'AUTH',pay:'PAY',localize:'LOC'}";
          const defs2="const defs={auth:'AUTH',pay:'PAY',localize:'LOC',site:'SITE'}";
          if(app.includes(defs))app=app.replace(defs,defs2);
          if(!app.includes(defs2))throw new Error('SITE badge defs missing');
          if(!app.includes('notifyActionTransitions'))throw new Error('Actions UI contract missing');
          if(!html.includes('monitorTabActions'))throw new Error('Actions tab missing');
          fs.writeFileSync(htmlPath,html);
          fs.writeFileSync(appPath,app);
          NODE
          node --check app.js
          grep -Fq 'name="hub_site_enabled"' index.html
          grep -Fq 'name="hub_site_probe"' index.html
          grep -Fq "site:'SITE'" app.js
          grep -Fq 'notifyActionTransitions' app.js
          grep -Fq 'monitorTabActions' index.html
      - name: Commit live fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'SuaveForge Automation'
          git config user.email '53187583+programmer119@users.noreply.github.com'
          git add index.html app.js
          git commit -m 'fix: show Site Hub in project editor'
          git push origin HEAD:main
