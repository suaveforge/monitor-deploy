name: Verify SiteHub editor public once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-sitehub-editor-public-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify live Site Hub editor and preserved Actions UI
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 12 https://monitor.suaveforge.com/ -o /tmp/index.html && curl -fsS --max-time 12 https://monitor.suaveforge.com/app.js -o /tmp/app.js; then
              if grep -Fq 'name="hub_site_enabled"' /tmp/index.html && grep -Fq 'name="hub_site_probe"' /tmp/index.html && grep -Fq "['auth','pay','localize','site']" /tmp/app.js && grep -Fq "site:'SITE'" /tmp/app.js; then break; fi
            fi
            [ "$i" -lt 20 ] || { echo 'live Site Hub editor not updated'; exit 1; }
            sleep 3
          done
          grep -Fq 'monitorTabActions' /tmp/index.html
          grep -Fq 'notifyActionTransitions' /tmp/app.js
          curl -fsS --max-time 12 https://api-monitor.suaveforge.com/api/health -o /tmp/health.json
          test -s /tmp/health.json
          echo 'MONITOR_PROJECT_EDITOR_SITEHUB=PASS'
          echo 'MONITOR_ACTIONS_UI_PRESERVED=PASS'
          echo 'MONITOR_PUBLIC_API_HEALTH=PASS'
